<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="luumoh_rider_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>luumoh_rider_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.PasskeyAuthenticator = window.PasskeyAuthenticator || {
      init: function () {},
      register: function () {
        return Promise.reject(new Error('Passkeys are not enabled in this app.'));
      },
      login: function () {
        return Promise.reject(new Error('Passkeys are not enabled in this app.'));
      },
      cancelCurrentAuthenticatorOperation: function () {},
      isUserVerifyingPlatformAuthenticatorAvailable: function () {
        return Promise.resolve(false);
      },
      isConditionalMediationAvailable: function () {
        return Promise.resolve(false);
      },
      hasPasskeySupport: function () {
        return false;
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function () {});
      });
    }

    if ('caches' in window) {
      caches.keys()
        .then(function (keys) {
          return Promise.all(keys
            .filter(function (key) { return key.indexOf('flutter') !== -1; })
            .map(function (key) { return caches.delete(key); }));
        })
        .catch(function () {});
    }
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        canvasKitVariant: 'full'
      }
    });
  </script>
</body>
</html>
